# Apex verify checks this repository's own pull requests and keeps its badge up to date. Without the GEMINI_API_KEY secret it runs the tests and the cheating scan only.
name: Apex verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          fail-on: never
          badge: true
  # The same check through the released Action (@v1), which downloads the release bundle instead of building: this keeps that path tested.
  released:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: apex-engine-dev/apex-verify@v1
        with:
          fail-on: never
          comment: false
