name: "Apex verify: AI change checker"
description: Catch AI code changes that pass your tests but are wrong. An independent model writes the missing checks.
author: Apex verify
branding:
  icon: check-circle
  color: green
inputs:
  task:
    description: What the change should do. Defaults to the pull request title and description.
    required: false
    default: ""
  api-key:
    description: API key of the model that writes the checks (pass it as a secret). Without it (or on fork pull requests, where GitHub withholds secrets) only the tests and the cheating scan run, and the verdict is at most unknown.
    required: false
    default: ""
  model:
    description: The model that writes the checks. Use a different, ideally stronger one than the agent that made the change.
    required: false
    default: gemini-3.1-pro-preview
  provider:
    description: gemini, openai, anthropic or openrouter (or set base-url).
    required: false
    default: gemini
  base-url:
    description: Any hosted OpenAI-compatible endpoint (overrides provider).
    required: false
    default: ""
  base:
    description: The commit to compare with. Defaults to the pull request's base commit.
    required: false
    default: ""
  test-command:
    description: Your test command when the project's tests are not detected.
    required: false
    default: ""
  fail-on:
    description: When to fail the job - not_ready (default; this also fails when the run itself errors), unknown (also fail when there is not enough to say) or never.
    required: false
    default: not_ready
  comment:
    description: Post (and update) one comment on the pull request.
    required: false
    default: "true"
  badge:
    description: On pushes (not pull requests), publish a badge file with the verdict to the apex-badge branch, for a shields.io endpoint badge (see docs/INTEGRATIONS.md). Needs "contents write" permission and a public repository.
    required: false
    default: "false"
  node-version:
    description: Node.js version to install for the job (for example "22"). Empty (the default) keeps the runner's own Node, so your project's tests run on the Node your job already uses; Apex verify itself needs Node 20 or newer.
    required: false
    default: ""
  require-sandbox:
    description: Refuse to run the change's code and the model-written checks without a test sandbox (on Linux the Action installs bubblewrap for it). "false" allows an unsandboxed run, which lets code in the pull request read anything the job can.
    required: false
    default: "true"
outputs:
  verdict:
    description: ready, not_ready or unknown.
    value: ${{ steps.run.outputs.verdict }}
  report:
    description: Path of the full JSON report.
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    # Only when asked: setup-node changes Node for the rest of the job, and a project that needs Node 22 must keep it.
    - if: inputs.node-version != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Check Node and set up the test sandbox
      shell: bash
      env:
        REQUIRE_SANDBOX: ${{ inputs.require-sandbox }}
      run: |
        set -uo pipefail
        MAJOR=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
        if [ "$MAJOR" -lt 20 ]; then echo "::error title=Apex verify::Node 20 or newer is needed (found $(node --version 2>/dev/null || echo none)). Set the node-version input, or add actions/setup-node before this step."; exit 1; fi
        # The change's tests and the checks a model wrote run in bubblewrap on Linux: no network, no writes outside a scratch copy,
        # and no view of this job's processes (so not of the API key or the token either). Ubuntu 24.04 blocks the user namespaces it needs by default.
        if [ "$RUNNER_OS" = "Linux" ]; then
          if ! command -v bwrap >/dev/null 2>&1; then
            (sudo -n apt-get install -y -qq bubblewrap >/dev/null 2>&1 || { sudo -n apt-get update -qq >/dev/null 2>&1 && sudo -n apt-get install -y -qq bubblewrap >/dev/null 2>&1; }) || true
          fi
          sudo -n sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          if bwrap --ro-bind / / --dev /dev --unshare-net --unshare-pid true >/dev/null 2>&1; then echo "Test sandbox: Linux bubblewrap."
          elif [ "$REQUIRE_SANDBOX" = "true" ]; then echo "::error title=Apex verify::No usable test sandbox (bubblewrap could not be installed or started). Install bubblewrap and allow unprivileged user namespaces on this runner, or set require-sandbox: false to run without one."
          else echo "::warning title=Apex verify::Running without a test sandbox: code in the pull request can read anything this job can."; fi
        fi
    - name: Install Apex verify
      id: install
      shell: bash
      env:
        # Passed in explicitly: inside a composite action the GITHUB_ACTION_REF variable is not reliably set.
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -uo pipefail
        cd "$GITHUB_ACTION_PATH"
        # On a release tag (vX.Y.Z, or the moving v1) the bundle built for that release is downloaded: seconds, not a build.
        # On any other ref, or when the download fails or is not the expected version, the bundle is built from this source.
        REF="${ACTION_REF:-}"; VER=$(node -p 'require("./package.json").version')
        BIN=""
        if [ "$REF" = "v$VER" ] || [ "$REF" = "v1" ]; then
          D="$RUNNER_TEMP/apex-bundle"; rm -rf "$D"; mkdir -p "$D"
          URL="https://github.com/${ACTION_REPO:-apex-engine-dev/apex-verify}/releases/download/v$VER/apex-verify-$VER.tgz"
          if curl -fsSL --retry 2 --max-time 60 -o "$D/a.tgz" "$URL" && tar -xzf "$D/a.tgz" -C "$D" \
             && [ "$(node -p 'require(process.argv[1]).version' "$D/package/package.json" 2>/dev/null)" = "$VER" ] && [ -f "$D/package/dist/apex.mjs" ]; then
            BIN="$D/package/dist/apex.mjs"; echo "Apex verify $VER: using the release bundle."
          else echo "::notice title=Apex verify::The release bundle for v$VER could not be used; building from source."; fi
        fi
        if [ -z "$BIN" ]; then
          npm install --no-audit --no-fund --loglevel=error   # the "prepare" script builds and bundles dist/apex.mjs
          test -f dist/apex.mjs || exit 1
          BIN="$GITHUB_ACTION_PATH/dist/apex.mjs"
        fi
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"
    # "Re-run job" on the same commit reuses the checks drafted the first time, so the verdict does not change between runs.
    # A new commit gets a fresh draft (the key is the commit). Entries carry a MAC made with the API key and are ignored
    # without a valid one, so a pull request cannot plant checks here. The folder is the tool's own (~/.apex-verify), which the
    # test sandbox cannot write. Skipped when there is no key (nothing is drafted).
    - name: Keep the drafted checks for a re-run
      if: inputs.api-key != ''
      uses: actions/cache@v4
      with:
        path: ~/.apex-verify/cache
        key: apex-verify-checks-v1-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
    - name: Verify
      id: run
      shell: bash
      env:
        INPUT_TASK: ${{ inputs.task }}
        INPUT_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_TEST: ${{ inputs.test-command }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_BADGE: ${{ inputs.badge }}
        APEX_BIN: ${{ steps.install.outputs.bin }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REQUIRE_SANDBOX: ${{ inputs.require-sandbox }}
        # No GitHub token in this step: it runs the pull request's code. Commenting and the badge happen in the next step.
      run: |
        set +e   # GitHub starts steps with -e; the exit code is handled below
        set -uo pipefail
        # Everything from the pull request reaches the script through environment variables, never through the shell text.
        TASK="${INPUT_TASK}"
        if [ -z "$TASK" ]; then TASK="${PR_TITLE:-}"; [ -n "${PR_BODY:-}" ] && TASK="$TASK"$'\n\n'"$PR_BODY"; fi
        if [ -z "$TASK" ]; then TASK="${COMMIT_MSG:-the change in this commit}"; fi
        BASE="${INPUT_BASE:-${PR_BASE_SHA:-HEAD~1}}"
        OUT="$RUNNER_TEMP/apex"; mkdir -p "$OUT"
        # A shallow checkout may not have the base commit (HEAD~1 on a push): deepen it before comparing, so the run is a real one and not a setup error.
        if ! git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --quiet --deepen=50 origin 2>/dev/null || git -C "$GITHUB_WORKSPACE" fetch --no-tags --quiet origin "$BASE" 2>/dev/null || true
        fi
        ARGS=(verify --task "$TASK" --dir "$GITHUB_WORKSPACE" --base "$BASE" --quiet --format text --markdown-out "$OUT/report.md" --sarif-out "$OUT/report.sarif" --json-out "$OUT/report.json" --badge-out "$OUT/badge.json")
        [ -n "$INPUT_TEST" ] && ARGS+=(--test "$INPUT_TEST")
        if [ -n "$INPUT_BASE_URL" ]; then ARGS+=(--base-url "$INPUT_BASE_URL" --model "$INPUT_MODEL" --api-key-env APEX_CHECKER_KEY)
        else ARGS+=(--provider "$INPUT_PROVIDER" --model "$INPUT_MODEL" --api-key-env APEX_CHECKER_KEY); fi
        if [ -z "$INPUT_KEY" ]; then
          ARGS+=(--no-model)
          echo "::notice title=Apex verify::No API key (or a fork pull request): running the tests and the cheating scan only, so the verdict is at most unknown."
        else export APEX_CHECKER_KEY="$INPUT_KEY"; fi
        [ "$REQUIRE_SANDBOX" = "true" ] && export APEX_REQUIRE_SANDBOX=1
        node "$APEX_BIN" "${ARGS[@]}" | tee "$OUT/report.txt"
        CODE=${PIPESTATUS[0]}
        VERDICT=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).verdict)}catch{console.log("error")}' "$OUT/report.json")
        # No report means no verification happened (a crash, or arguments that never reached verify): that is an error, whatever the exit code said.
        if [ "$VERDICT" = "error" ] && [ "$CODE" -ne 2 ]; then CODE=2; fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"; echo "report=$OUT/report.json" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"
        [ -f "$OUT/report.md" ] && cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
        exit 0
    - name: Post the result
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_BADGE: ${{ inputs.badge }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        VERDICT: ${{ steps.run.outputs.verdict }}
        CODE: ${{ steps.run.outputs.code }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set +e
        set -uo pipefail
        OUT="$RUNNER_TEMP/apex"; CODE="${CODE:-2}"
        if [ "$INPUT_COMMENT" = "true" ] && [ -n "${PR_NUMBER:-}" ] && [ -f "$OUT/report.md" ]; then
          ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- apex-verify -->")))][0].id // empty' 2>/dev/null || true)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$OUT/report.md" >/dev/null 2>&1 || echo "::warning::Could not update the Apex verify comment (read-only token on a fork pull request?). The report is in the job summary."
          else gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$OUT/report.md" >/dev/null 2>&1 || echo "::warning::Could not post the Apex verify comment (read-only token on a fork pull request?). The report is in the job summary."; fi
        fi
        if [ "$INPUT_BADGE" = "true" ] && [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -f "$OUT/badge.json" ]; then
          B=$(mktemp -d); URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" apex-badge >/dev/null 2>&1; then git clone -q --depth 1 --branch apex-badge "$URL" "$B"
          else git init -q "$B"; git -C "$B" checkout -q -b apex-badge; git -C "$B" remote add origin "$URL"; fi
          cp "$OUT/badge.json" "$B/apex-verify-badge.json"
          GIT_ID=(-c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com)
          git -C "$B" "${GIT_ID[@]}" add -A
          git -C "$B" "${GIT_ID[@]}" commit -q -m "Apex verify badge: $VERDICT" 2>/dev/null || true
          git -C "$B" push -q origin apex-badge 2>/dev/null || echo "::warning::Could not publish the badge (the workflow needs permissions: contents: write)."
        fi
        case "$INPUT_FAIL_ON" in
          never) exit 0 ;;
          unknown) [ "$CODE" -ne 0 ] && exit 1 || exit 0 ;;
          # not_ready (1) fails the job, and so does a crash or setup error (2): a run that could not verify must not look like a pass
          *) { [ "$CODE" -eq 1 ] || [ "$CODE" -eq 2 ]; } && exit 1 || exit 0 ;;
        esac
